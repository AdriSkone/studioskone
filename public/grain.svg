<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!--
    Bruit de fond. Il ne porte pas sa couleur : il ne sert que de masque.
    La teinte vient du CSS (--grain-teinte), pour qu'elle reste un token et
    ne soit pas enfermée dans un fichier d'image.

    fractalNoise et non turbulence : le premier donne un grain fin et
    régulier, le second des volutes qui se remarquent. numOctaves 4 casse
    la répétition ; stitchTiles raccorde les bords, sans quoi la trame
    laisse voir sa grille au moment où elle se répète.
  -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="300" height="300" filter="url(#grain)"/>
</svg>
